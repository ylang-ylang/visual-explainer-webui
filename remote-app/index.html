<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>图解工作台 · Visual Explainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232c665d'/%3E%3Cpath d='M8 8h6v16H8zm10 0h6v7h-6zm0 11h6v5h-6z' fill='white'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: VisualCJK;
      src: url('/assets/cjk.woff2') format('woff2');
      font-display: swap;
    }

    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", VisualCJK, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-synthesis: none;
      color: #26332f;
      background: #fff;
      --ink: #26332f;
      --muted: #707a76;
      --line: #e5e9e6;
      --soft: #f6f8f6;
      --accent: #2c665d;
      --accent-soft: #eaf2ee;
      --danger: #a13d32;
      --bar-height: 54px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; height: 100dvh; font-size: 14px; }
    button, input, select, a { font: inherit; -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .45; }
    button, a, input, select { outline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); }
    button { color: inherit; }
    svg { display: block; flex: none; }
    h1, h2, p { margin: 0; }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      font-size: 12px;
      line-height: 1.4;
    }
    .button:hover:not(:disabled) { background: #edf1ee; }
    .button.bordered { border-color: var(--line); background: #fff; }
    .button.bordered:hover:not(:disabled) { background: var(--soft); }
    .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .button.primary:hover:not(:disabled) { background: #23564e; }
    .icon-button { width: 34px; padding: 7px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .appbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex: 0 0 var(--bar-height);
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .appbar-start, .appbar-actions, .brand { display: flex; align-items: center; }
    .appbar-start { gap: 16px; min-width: 0; }
    .brand { gap: 9px; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      color: #fff;
      background: var(--accent);
    }
    #nav-toggle { border-color: var(--line); }
    #nav-toggle[aria-expanded="true"] { background: var(--soft); }
    .appbar-actions { gap: 5px; flex-shrink: 0; }
    .connection { display: inline-flex; align-items: center; gap: 7px; margin-right: 10px; color: var(--muted); font-size: 11px; }
    .connection::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #a4aca7; }
    .connection[data-state="online"]::before { background: #43816b; }
    .connection[data-state="error"]::before { background: #b87540; }
    #refresh[aria-busy="true"] .icon { animation: spin 1s linear infinite; }

    .workspace { display: flex; flex: 1; min-height: 0; min-width: 0; }
    .library {
      display: flex;
      flex-direction: column;
      flex: 0 0 280px;
      width: 280px;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: #fafbf9;
    }
    .library-top { padding: 22px 16px 12px; }
    .library-heading { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .library-heading h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .count { flex-shrink: 0; min-width: 22px; padding: 1px 6px; border-radius: 5px; background: #eaf0eb; color: #647168; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; }
    #close-library { flex-shrink: 0; margin: -7px -6px -7px auto; }
    .entity-field { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    #entity-filter { flex: 1; min-width: 0; width: 100%; height: 34px; padding: 0 8px; border: 1px solid #dce3dc; border-radius: 6px; background: #fff; color: var(--ink); text-overflow: ellipsis; }
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid #dce3dc;
      border-radius: 7px;
      background: #fff;
      color: var(--muted);
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px #2c665d12; }
    .search .icon { width: 15px; height: 15px; }
    .search input { width: 100%; min-width: 0; padding: 0; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 12px; }
    .search input::placeholder { color: #89918d; }
    .search-hint { margin: 11px 1px 0; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    kbd { font: inherit; color: #8b948e; }
    #list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 8px 12px; scrollbar-width: thin; scrollbar-color: #cbd3cc transparent; }
    .report {
      position: relative;
      display: block;
      width: 100%;
      margin: 3px 0;
      padding: 13px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }
    .report:hover { background: #f0f3ef; }
    .report[aria-current="page"] { background: var(--accent-soft); }
    .report[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 2px; background: var(--accent); }
    .report-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; font-size: 13px; font-weight: 500; line-height: 1.65; }
    .report[aria-current="page"] .report-title { color: #24594f; font-weight: 600; }
    .report-file { display: block; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .report-date { display: block; margin-top: 8px; color: #7b857e; font-size: 10px; font-variant-numeric: tabular-nums; }
    .list-message { padding: 34px 18px; text-align: center; }
    .list-message strong { display: block; font-size: 13px; font-weight: 500; }
    .list-message p { margin: 8px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
    .library-foot { flex: none; padding: 13px 18px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 1.8; }
    #sync { display: block; color: #58685e; font-size: 11px; }
    #sync[data-state="error"] { color: var(--danger); }
    .nav-backdrop { display: none; }

    .viewer { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: #fff; }
    .viewer-toolbar { display: flex; flex: none; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; min-height: 76px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
    .viewer-title { flex: 1 1 200px; min-width: 0; }
    .viewer-title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 600; line-height: 1.6; }
    .viewer-title p { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .viewer-actions { display: flex; align-items: center; flex-shrink: 0; gap: 8px; }
    .sizes { display: flex; gap: 2px; padding: 3px; border-radius: 7px; background: #f0f3f0; }
    .sizes .button { min-height: 28px; padding: 4px 9px; gap: 5px; color: var(--muted); font-size: 11px; }
    .sizes .icon { width: 14px; height: 14px; }
    .sizes .button[aria-pressed="true"] { color: var(--ink); background: #fff; box-shadow: 0 1px 3px #23362c14; }
    .tool-separator { width: 1px; height: 19px; margin: 0 2px; background: var(--line); }
    .stage { position: relative; display: flex; justify-content: center; flex: 1; min-width: 0; min-height: 0; overflow: hidden; background: #fff; }
    .stage[data-size="mobile"] { background: #edf0ed; }
    #preview { display: block; flex: none; width: 100%; height: 100%; border: 0; background: #fff; }
    .stage[data-size="mobile"] #preview { width: min(390px, 100%); box-shadow: 0 0 0 1px #dce2dc; }
    .placeholder { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; padding: 28px; overflow-y: auto; background: #fff; text-align: center; }
    .placeholder-icon { display: grid; place-items: center; width: 48px; height: 48px; margin-bottom: 19px; border-radius: 12px; background: var(--soft); color: #829187; }
    .placeholder-icon .icon { width: 24px; height: 24px; stroke-width: 1.4; }
    .placeholder h2 { font-size: 17px; font-weight: 500; line-height: 1.6; }
    .placeholder p { max-width: 330px; margin-top: 9px; color: var(--muted); font-size: 13px; line-height: 1.9; overflow-wrap: anywhere; }
    .placeholder .button { margin-top: 20px; }
    .spinner { width: 22px; height: 22px; border: 2px solid #dce7df; border-top-color: var(--accent); border-radius: 50%; animation: spin .85s linear infinite; }
    .placeholder[data-loading="true"] .placeholder-icon > .icon { display: none; }
    .placeholder:not([data-loading="true"]) .spinner { display: none; }
    .viewer-footer { display: flex; align-items: center; justify-content: space-between; flex: none; gap: 16px; min-height: 29px; padding: 5px 22px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    #page-detail { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .share-hint { white-space: nowrap; color: #8a938c; }
    .stage:fullscreen { width: 100%; height: 100%; }
    #exit-fullscreen { position: absolute; right: 16px; top: 12px; z-index: 3; box-shadow: 0 2px 10px #26332f1a; }

    dialog { width: 408px; max-width: calc(100% - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; margin: auto; padding: 32px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: #fff; box-shadow: 0 24px 90px #24372c26; }
    dialog::backdrop { background: #e8ede8d9; backdrop-filter: blur(4px); }
    .login-brand { display: flex; align-items: center; gap: 9px; margin-bottom: 27px; color: var(--muted); font-size: 12px; }
    dialog h2 { font-size: 22px; font-weight: 600; letter-spacing: -.4px; }
    .login-description { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.9; }
    dialog label { display: block; margin: 26px 0 9px; font-size: 12px; font-weight: 500; }
    dialog input { width: 100%; height: 44px; padding: 10px 12px; border: 1px solid #d5ddd6; border-radius: 7px; color: var(--ink); background: #fff; font-size: 16px; }
    dialog input[aria-invalid="true"] { border-color: var(--danger); }
    dialog .primary { width: 100%; min-height: 43px; margin-top: 17px; font-size: 13px; }
    #login-error { min-height: 19px; margin-top: 12px; color: var(--danger); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    #notice { position: fixed; z-index: 50; bottom: 44px; left: 50%; width: max-content; max-width: calc(100% - 32px); transform: translateX(-50%); padding: 10px 16px; border: 1px solid #dce4dd; border-radius: 8px; background: #fff; color: var(--ink); box-shadow: 0 5px 22px #24372c1c; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1100px) and (min-width: 761px) {
      .library { flex-basis: 250px; width: 250px; }
      .viewer-toolbar { padding: 12px 16px; }
      .viewer-title { flex-basis: 100%; }
      .viewer-actions { margin-left: auto; }
    }
    @media (max-width: 760px) {
      :root { --bar-height: 52px; }
      .appbar { gap: 8px; padding: 0 12px; }
      .appbar-start { gap: 12px; }
      .brand { gap: 7px; font-size: 13px; }
      .brand-mark { width: 23px; height: 23px; border-radius: 6px; }
      .brand-mark .icon { width: 16px; height: 16px; }
      .connection { margin: 0 6px 0 0; }
      .connection span, .refresh-label { display: none; }
      #refresh { width: 34px; padding: 7px; }
      .appbar-actions { gap: 2px; }
      .library { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(340px, calc(100% - 40px)); border-right: 0; box-shadow: 8px 0 35px #26332f1a; }
      .library-top { padding-top: 23px; }
      .library-heading { margin-bottom: 20px; }
      .library-heading h2 { font-size: 16px; }
      #close-library { width: 40px; height: 40px; }
      #entity-filter { height: 42px; font-size: 16px; }
      .search { height: 42px; }
      .search input { font-size: 16px; }
      .search-hint kbd { display: none; }
      .report { padding: 14px; }
      .report-title { font-size: 14px; }
      .report-file, .report-date { font-size: 11px; }
      .library-foot { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
      .nav-backdrop { position: fixed; z-index: 20; inset: 0; display: block; width: 100%; height: 100%; padding: 0; border: 0; background: #26332f38; }
      .viewer-toolbar { display: block; min-height: 0; padding: 12px 14px 10px; }
      .viewer-title h1 { font-size: 14px; }
      .viewer-title p { font-size: 10px; }
      .viewer-actions { justify-content: flex-end; gap: 7px; margin-top: 11px; }
      .sizes { margin-right: auto; }
      .viewer-actions > .button { min-height: 36px; }
      .viewer-footer { min-height: 28px; padding: 5px 14px max(5px, env(safe-area-inset-bottom)); }
      .share-hint { display: none; }
      .placeholder { padding: 24px; }
      dialog { padding: 27px 24px; }
    }
    @media (max-width: 360px) {
      .brand-mark, .connection { display: none; }
      .appbar-start { gap: 9px; }
      .viewer-actions { gap: 4px; }
      .tool-separator { margin: 0; }
      .viewer-actions .button { padding-left: 7px; padding-right: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner, #refresh[aria-busy="true"] .icon { animation: none; }
    }

    .library-tools { display: flex; gap: 4px; margin: -2px 0 10px; }
    .library-tools .button { flex: 1; padding-inline: 6px; }
    .folder { margin: 3px 0; min-width: 0; }
    .folder > summary { display: flex; align-items: center; gap: 5px; min-height: 36px; padding: 2px 4px; border-radius: 6px; cursor: pointer; list-style: none; }
    .folder > summary::-webkit-details-marker { display: none; }
    .folder > summary::before { content: "›"; width: 12px; flex: none; text-align: center; color: var(--muted); }
    .folder[open] > summary::before { transform: rotate(90deg); }
    .folder > summary:hover { background: #edf1ee; }
    .folder-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .folder-children { margin-left: 9px; padding-left: 4px; border-left: 1px solid var(--line); }
    .folder-empty { padding: 8px 12px; color: var(--muted); font-size: 11px; }
    .folder-action { min-height: 28px; width: 28px; padding: 2px; }
    .page-tools { display: flex; gap: 4px; margin-top: 5px; }
    .page-tools .button { min-height: 27px; padding: 3px 7px; }
    .history-banner { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 7px 16px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-size: 12px; }
    #history-label { flex: 1; min-width: 100px; overflow-wrap: anywhere; }
    dialog.panel { width: 560px; padding: 22px; }
    .dialog-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .dialog-heading h2 { min-width: 0; font-size: 18px; overflow-wrap: anywhere; }
    .dialog-heading .button { flex: none; }
    .panel label { margin: 18px 0 7px; }
    .panel input, .panel select { height: 40px; font-size: 14px; }
    .panel select { width: 100%; padding: 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #fff; }
    .panel .primary { width: auto; min-height: 34px; margin: 0; font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .dialog-error { min-height: 18px; margin-top: 12px; color: var(--danger); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .subtle { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
    .danger { color: var(--danger); }
    .code-field { display: block; width: 100%; max-width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--ink); font: 11px/1.7 ui-monospace, monospace; overflow-wrap: anywhere; }
    textarea.code-field { resize: vertical; min-height: 105px; white-space: pre-wrap; }
    #api-secret { font-family: ui-monospace, monospace; font-size: 12px; }
    .inline-form { display: flex; align-items: center; gap: 8px; }
    .inline-form input { min-width: 0; flex: 1; }
    .inline-form .button { flex: none; }
    .token-row, .version-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .row-copy { min-width: 0; flex: 1; overflow-wrap: anywhere; font-size: 12px; line-height: 1.7; }
    .row-copy small { display: block; color: var(--muted); font-size: 10px; }
    #api-tokens, #versions-list { margin-top: 12px; }
    #api-unlock { margin-top: 10px; }
    #login-cancel { width: 100%; margin-top: 7px; }
    @media (max-width: 760px) {
      dialog.panel { padding: 18px; }
      .viewer-actions { flex-wrap: wrap; }
      .panel input, .panel select { font-size: 16px; }
      .panel .code-field, #api-secret { font-size: 12px; }
      .history-banner { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <header class="appbar" id="appbar">
    <div class="appbar-start">
      <button id="nav-toggle" class="button" type="button" aria-label="收起图解列表" aria-controls="library" aria-expanded="true" title="展开或收起图解列表">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M5.5 8h1M5.5 12h1"/></svg>
        <span>图解</span>
      </button>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="M14 15h6m-6 5h6"/></svg></span>
        <span>图解工作台</span>
      </div>
    </div>
    <div class="appbar-actions">
      <span id="connection" class="connection" data-state="pending" title="正在连接服务"><span>连接中</span></span>
      <button id="refresh" class="button" type="button" aria-label="刷新图解列表" title="刷新图解列表">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg>
        <span class="refresh-label">刷新</span>
      </button>
      <button id="admin-unlock" class="button" type="button" hidden>管理</button>
      <button id="logout" class="button" type="button" hidden>退出</button>
    </div>
  </header>

  <main class="workspace">
    <button id="nav-backdrop" class="nav-backdrop" type="button" aria-label="关闭图解列表" tabindex="-1" hidden></button>
    <aside id="library" class="library" aria-labelledby="library-title">
      <div class="library-top">
        <div class="library-heading">
          <h2 id="library-title">全部图解</h2>
          <span id="count" class="count" aria-label="图解数量">—</span>
          <button id="close-library" class="button icon-button" type="button" aria-label="收起图解列表" title="收起图解列表">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg>
          </button>
        </div>
        <label class="entity-field" for="entity-filter">
          <span>空间</span>
          <select id="entity-filter" disabled>
            <option value="*">全部图解</option>
          </select>
        </label>
        <div class="library-tools">
          <button id="space-create" class="button bordered" type="button" title="新建空间" disabled>＋ 空间</button>
          <button id="folder-create" class="button" type="button" title="新建目录" disabled>＋ 目录</button>
          <button id="space-api" class="button bordered" type="button" title="当前空间 API 接入" disabled>API</button>
        </div>
        <label class="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="搜索标题或路径" aria-label="搜索标题或路径" aria-keyshortcuts="Control+k Meta+k" autocomplete="off">
        </label>

    <section id="viewer" class="viewer" aria-label="图解阅读器">

              桌面

          <a id="open" class="button bordered" target="_blank" rel="noopener noreferrer" title="在新标签页打开；持有链接的人可直接访问此图解" hidden>
            独立打开
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M10 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg>

      <div id="stage" class="stage" data-size="desktop" aria-busy="true">
        <div id="placeholder" class="placeholder" data-loading="true" role="status">
          <div class="placeholder-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h4"/></svg>
            <span class="spinner"></span>

          <h2 id="placeholder-title">正在读取图解</h2>
          <p id="placeholder-description">稍候，正在获取图解列表。</p>
          <button id="placeholder-action" class="button bordered" type="button" hidden></button>

        <iframe id="preview" title="图解预览" sandbox="allow-scripts" hidden></iframe>
        <button id="exit-fullscreen" class="button bordered" type="button" hidden>退出全屏</button>

  </main>

  <dialog id="login" aria-labelledby="login-title" aria-describedby="login-description">
    <form id="login-form">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="M14 15h6m-6 5h6"/></svg></span>
        图解工作台

      <h2 id="login-title">登录后开始阅读</h2>

        <button class="button bordered" type="button" data-close="confirm-dialog">取消</button>

  <div id="notice" role="status" hidden></div>

  <script>
    const $ = id => document.getElementById(id);
    const compact = window.matchMedia('(max-width: 760px)');
    const dates = new Intl.DateTimeFormat('zh-CN', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
    const times = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit' });
    const POLL_INTERVAL = 15000;
    const REQUEST_TIMEOUT = 15000;
    let pages = [];
    let entityCatalog = { entities: [], unassignedCount: 0, totalCount: 0 };
    let selectedEntity = '*';
    let libraryLoaded = false;
    let pendingFilename = hashFilename();
    let selected = null;
    let authenticated = false;
    let signingOut = false;
    let listState = 'loading';
    let listError = '';
    let pageRequest = null;
    let previewRequest = null;
    let previewTimer;
    let noticeTimer;
    let placeholderAction = null;
    let desktopNavOpen = true;
    let mobileNavOpen = false;
    let role = 'viewer';
    let unlocking = false;
    let afterUnlock = null;
    let treeEntity = '';
    let treeFolders = [];
    let treeRequest = null;
    let treeError = '';
    const folderExpansion = new Map();
    let historical = null;
    let editContext = null;
    let confirmation = null;
    let apiContext = null;
    let versionsRequest = null;

    function notify(message) {
      clearTimeout(noticeTimer);
      $('notice').textContent = message;
      $('notice').hidden = false;
      noticeTimer = setTimeout(() => { $('notice').hidden = true; }, 5000);
    }

    function applyNavigation() {
      const open = compact.matches ? mobileNavOpen : desktopNavOpen;
      const modal = compact.matches && open;
      $('library').hidden = !open;
      $('nav-backdrop').hidden = !modal;
      $('nav-toggle').setAttribute('aria-expanded', String(open));
      $('nav-toggle').setAttribute('aria-label', open ? '收起图解列表' : '打开图解列表');
      $('appbar').inert = modal;
      $('viewer').inert = modal;
      if (modal) {
        $('library').setAttribute('role', 'dialog');
        $('library').setAttribute('aria-modal', 'true');
      } else {
        $('library').removeAttribute('role');
        $('library').removeAttribute('aria-modal');
      }
    }

    function setNavigation(open, restoreFocus = false) {
      if (compact.matches) mobileNavOpen = open;
      else desktopNavOpen = open;
      applyNavigation();
      if (open) $('search').focus();
      else if (restoreFocus) $('nav-toggle').focus();
    }

    function showPlaceholder(title, description, action = null, actionLabel = '', loading = false) {
      $('placeholder-title').textContent = title;
      $('placeholder-description').textContent = description;
      $('placeholder').dataset.loading = String(loading);
      $('placeholder').hidden = false;
      $('placeholder-action').hidden = !action;
      $('placeholder-action').textContent = actionLabel;
      placeholderAction = action;
      $('stage').setAttribute('aria-busy', String(loading));
    }

    function clearPreview() {
      previewRequest?.abort();
      previewRequest = null;
      clearTimeout(previewTimer);
      $('preview').hidden = true;
      $('preview').removeAttribute('src');
      selected = null;
      historical = null;
      $('history-banner').hidden = true;
      $('page-edit').disabled = true;
      $('page-versions').disabled = true;
      $('page-title').textContent = '图解阅读器';
      $('page-title').removeAttribute('title');
      $('page-meta').textContent = '从列表中选择一份图解';
      $('page-meta').removeAttribute('title');
      $('page-detail').textContent = '等待选择图解';
      $('open').hidden = true;
      $('open').removeAttribute('href');
      $('fullscreen').disabled = true;
      document.title = '图解工作台 · Visual Explainer';
    }

    function showLogin() {
      role = 'viewer';
      unlocking = false;
      afterUnlock = null;
      treeRequest?.abort();
      treeEntity = '';
      treeFolders = [];
      treeError = '';
      for (const dialog of document.querySelectorAll('dialog[open]')) dialog.close();
      configureLogin(false);
      authenticated = false;
      pages = [];
      entityCatalog = { entities: [], unassignedCount: 0, totalCount: 0 };
      selectedEntity = '*';
      libraryLoaded = false;
      pendingFilename = hashFilename();
      renderEntityFilter();
      listState = 'locked';
      $('logout').hidden = true;
      $('sync').textContent = '登录后自动更新';
      $('sync').dataset.state = '';
      clearPreview();
      renderList();
      showPlaceholder('登录后查看图解', '使用访问密钥打开你的图解库。');
      if (compact.matches) setNavigation(false);
      if (!$('login').open) {
        $('login-error').textContent = '';
        $('key').removeAttribute('aria-invalid');
        $('login').showModal();
      }
    }

    function inSelectedEntity(page) {
      return selectedEntity === '*' || (page.entityId ?? '') === selectedEntity;
    }

    function entityName() {
      if (selectedEntity === '*') return '全部图解';
      if (selectedEntity === '') return '未分配';
      return entityCatalog.entities.find(entity => entity.id === selectedEntity)?.name || '全部图解';
    }

    function entityCount() {
      if (selectedEntity === '*') return entityCatalog.totalCount;
      if (selectedEntity === '') return entityCatalog.unassignedCount;
      return entityCatalog.entities.find(entity => entity.id === selectedEntity)?.diagramCount ?? 0;
    }

    function renderEntityFilter() {
      const options = [
        ['*', '全部图解', entityCatalog.totalCount],
        ['', '未分配', entityCatalog.unassignedCount],
        ...entityCatalog.entities.map(entity => [entity.id, entity.name, entity.diagramCount]),
      ];
      $('entity-filter').replaceChildren(...options.map(([value, name, count]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = libraryLoaded ? `${name} (${count})` : name;
        return option;
      }));
      $('entity-filter').value = selectedEntity;
      $('entity-filter').disabled = !libraryLoaded;
    }

    function showEmptyEntity() {
      clearPreview();
      history.replaceState(null, '', location.pathname + location.search);
      const title = selectedEntity === '*' ? '还没有图解'
        : selectedEntity === '' ? '没有未分配的图解' : `“${entityName()}”还没有图解`;
      const detail = selectedEntity === '*' ? '工作 agent 生成的图解会显示在这里，无需手动导入。'
        : selectedEntity === '' ? '未分配空间的图解会显示在这里。' : '通过此空间的 API 发布图解。';
      showPlaceholder(title, detail, () => loadPages(true), '刷新列表');
    }

    function revealPage(page) {
      if (!inSelectedEntity(page)) {
        selectedEntity = entityCatalog.entities.some(entity => entity.id === page.entityId)
          ? page.entityId : '*';
        $('entity-filter').value = selectedEntity;
      }
      const query = $('search').value.trim().toLocaleLowerCase();
      if (!(page.title + ' ' + pagePath(page)).toLocaleLowerCase().includes(query)) $('search').value = '';
      if (page.entityId) {
        const path = pagePath(page);
        expandPath(page.entityId, path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '');
      }
      selectPage(page, true);
    }

    function renderList() {
      const query = $('search').value.trim().toLocaleLowerCase();
      const filtered = pages.filter(page => inSelectedEntity(page)
        && (page.title + ' ' + pagePath(page)).toLocaleLowerCase().includes(query));
      const active = $('list').contains(document.activeElement) ? document.activeElement : null;
      const focusKey = active?.dataset.focusKey;
      const scrollTop = $('list').scrollTop;
      const fragment = document.createDocumentFragment();
      $('library-title').textContent = entityName();
      $('library-title').title = entityName();
      $('count').textContent = !libraryLoaded ? '—' : String(entityCount());
      $('list-caption').textContent = query ? `${filtered.length} 个搜索结果`
        : isSpaceSelected() ? '目录 · 最近更新' : '按最近更新';
      updateControls();

      function pageButton(page) {
        const button = makeButton('', () => {
          selectPage(page, true);
          if (compact.matches) {
            setNavigation(false);
            $('page-title').focus({ preventScroll: true });
          }
        }, 'report');
        button.dataset.filename = page.filename;
        button.dataset.focusKey = 'page:' + page.filename;
        button.title = pageTitle(page) + '\n' + pagePath(page);
        if (selected?.filename === page.filename) button.setAttribute('aria-current', 'page');
        for (const [className, text] of [
          ['report-title', pageTitle(page)],
          ['report-file', pagePath(page)],
          ['report-date', formatDate(page.modified)],
        ]) {
          const span = document.createElement('span');
          span.className = className;
          span.textContent = text;
          button.append(span);
        }
        return button;
      }

      if (isSpaceSelected()) {
        const root = { folders: new Map(), pages: [] };
        function directory(path) {
          let node = root;
          let prefix = '';
          for (const name of path.split('/').filter(Boolean)) {
            prefix = prefix ? prefix + '/' + name : name;
            if (!node.folders.has(name)) node.folders.set(name, { path: prefix, folders: new Map(), pages: [] });
            node = node.folders.get(name);
          }
          return node;
        }
        for (const folder of treeEntity === selectedEntity ? treeFolders : []) {
          if (!query || folder.path.toLocaleLowerCase().includes(query)) directory(folder.path);
        }
        for (const page of filtered) {
          const path = pagePath(page);
          const parent = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
          directory(parent).pages.push(page);
        }
        function appendNode(node, container) {
          for (const [name, child] of [...node.folders].sort(([a], [b]) => a.localeCompare(b, 'zh-CN'))) {
            const details = document.createElement('details');
            details.className = 'folder';
            details.dataset.path = child.path;
            const key = selectedEntity + ':' + child.path;
            details.open = query ? true : folderExpansion.get(key) ?? true;
            const summary = document.createElement('summary');
            summary.dataset.focusKey = 'folder:' + child.path;
            summary.title = child.path;
            const label = document.createElement('span');
            label.className = 'folder-name';
            label.textContent = name;
            const manage = makeButton('⋯', event => {
              event.preventDefault();
              event.stopPropagation();
              requireAdmin(() => openEditor('folder', { entityId: selectedEntity, path: child.path }));
            }, 'button folder-action');
            manage.setAttribute('aria-label', '管理目录 ' + child.path);
            manage.title = '重命名 / 移动 / 删除空目录';
            manage.dataset.focusKey = 'manage:' + child.path;
            summary.append(label, manage);
            details.append(summary);
            const children = document.createElement('div');
            children.className = 'folder-children';
            appendNode(child, children);
            if (!children.childElementCount) {
              const empty = document.createElement('p');
              empty.className = 'folder-empty';
              empty.textContent = '空目录';
              children.append(empty);
            }
            details.append(children);
            details.addEventListener('toggle', () => {
              if (!query && details.isConnected) folderExpansion.set(key, details.open);
            });
            container.append(details);
          }
          for (const page of node.pages) container.append(pageButton(page));
        }
        appendNode(root, fragment);
      } else {
        for (const page of filtered) fragment.append(pageButton(page));
      }
      if (treeError && isSpaceSelected()) {
        const error = document.createElement('p');
        error.className = 'dialog-error';
        error.textContent = treeError;
        fragment.prepend(error);
      }
      if (!fragment.childNodes.length) {
        const message = document.createElement('div');
        message.className = 'list-message';
        const title = document.createElement('strong');
        const detail = document.createElement('p');
        title.textContent = listState === 'locked' ? '尚未登录'
          : listState === 'loading' ? '正在读取…'
          : listState === 'error' && !libraryLoaded ? '暂时无法读取'
          : query ? '没有匹配的图解' : '还没有图解';
        detail.textContent = listState === 'error' && !libraryLoaded ? listError
          : query ? '试试其他标题或路径。'
          : isSpaceSelected() ? '通过 API 发布到此空间。' : '';
        message.append(title, detail);
        if (query) message.append(makeButton('清除搜索', () => {
          $('search').value = '';
          renderList();
          $('search').focus();
        }));
        else if (listState === 'error') message.append(makeButton('重试', () => loadPages(true)));
        fragment.append(message);
      }
      $('list').replaceChildren(fragment);
      if (focusKey) {
        const replacement = [...$('list').querySelectorAll('[data-focus-key]')]
          .find(element => element.dataset.focusKey === focusKey);
        (replacement || $('search')).focus({ preventScroll: true });
      }
      $('list').scrollTop = scrollTop;
    }

    async function loadPreview(page) {
      previewRequest?.abort();
      clearTimeout(previewTimer);
      const request = new AbortController();
      previewRequest = request;
      const timeout = setTimeout(() => request.abort(), REQUEST_TIMEOUT);
      $('preview').hidden = true;
      $('preview').removeAttribute('src');
      showPlaceholder('正在打开图解', page.title, null, '', true);
      const url = new URL(page.url, location.href);
      if (page.modified) url.searchParams.set('v', page.modified);
      try {
        // The sandbox is opaque. Check the HTTP status without reading or modifying its document.
        const response = await fetch(url, { method: 'HEAD', cache: 'no-store', signal: request.signal });
        if (previewRequest !== request) return;
        if (response.status === 401) {
          showLogin();
          return;
        }
        if (!response.ok) {
          throw new Error(response.status === 404
            ? '这份图解已不存在，请刷新列表或选择其他图解。'
            : `服务器暂时无法打开这份图解（${response.status}）。`);
        }
        const frame = document.createElement('iframe');
        frame.id = 'preview';
        frame.title = page.title + ' · 图解预览';
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.hidden = true;
        frame.addEventListener('load', () => {
          if (previewRequest !== request) return;
          clearTimeout(previewTimer);
          frame.hidden = false;
          $('placeholder').hidden = true;
          $('stage').setAttribute('aria-busy', 'false');
        });
        frame.addEventListener('error', () => {
          if (previewRequest !== request) return;
          clearTimeout(previewTimer);
          showPlaceholder('无法打开图解', '请重试，或使用上方的“独立打开”。',
            () => loadPreview(page), '重新打开');
        });

    function selectPage(page, explicit = false) {

    async function loadPages(manual = false) {

        if (responses.some(response => response.status === 401)) {

        }
        const [data, catalog, session] = await Promise.all(responses.map(async (response, index) => {
          const label = ['读取图解', '读取空间', '读取身份'][index];
          if (!response.ok) {
            const detail = await response.json().catch(() => null);
            throw new Error(`${label}失败（${response.status}）${detail?.error ? '：' + detail.error : '，请稍后重试。'}`);
          }
          return response.json();
        }));
        if (pageRequest !== request || $('login').open) return false;
        const pagesChanged = pages.length !== data.pages.length || data.pages.some((page, index) => {
          const previous = pages[index];
          return previous.filename !== page.filename || previous.title !== page.title
            || previous.modified !== page.modified || previous.bytes !== page.bytes || previous.url !== page.url
            || previous.entityId !== page.entityId || previous.path !== page.path;
        });
        const entitiesChanged = entityCatalog.totalCount !== catalog.totalCount
          || entityCatalog.unassignedCount !== catalog.unassignedCount
          || entityCatalog.entities.length !== catalog.entities.length
          || catalog.entities.some((entity, index) => {

        await loadTree();
        if (pageRequest !== request) return false;
        if (changed || linked || previousState !== 'ready') renderList();
        $('sync').textContent = '已同步 ' + times.format(new Date());
        if (manual) notify('图解列表已更新');
        return true;
      } catch (error) {
        if (pageRequest !== request) return false;
        listState = 'error';
        listError = request.signal.aborted ? '连接超时，请检查网络后重试。'
          : error instanceof TypeError ? '无法连接到服务，请检查网络后重试。' : error.message;
        $('sync').textContent = '同步失败 · ' + listError;
        $('sync').dataset.state = 'error';
        if (!libraryLoaded) {
          renderList();
          showPlaceholder('暂时无法读取图解', listError, () => loadPages(true), '重新加载');
        } else if (manual) notify(listError);

        clearTimeout(timeout);

          $('refresh').disabled = false;
          $('refresh').setAttribute('aria-busy', 'false');

        }
      }
    }

    async function checkConnection() {

    function pagePath(page) { return page.path || page.filename; }
    function pageTitle(page) {

        ? title : pagePath(page).split('/').pop();

    function isSpaceSelected() { return selectedEntity !== '*' && selectedEntity !== ''; }
    function entityRoute(id) { return '/api/entities/' + encodeURIComponent(id); }

    function makeButton(label, action, className = 'button bordered') {

    }
    async function apiRequest(path, { method = 'GET', body, signal } = {}) {
      const response = await fetch(path, {

        ...(body === undefined ? {} : { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }),
      });
      if (response.status === 204) return null;

      if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）。`);

    function updateControls() {

      $('login-description').textContent = admin ? '输入管理密钥。' : '输入访问密钥，或使用专属查看链接进入。';
      $('login-submit').textContent = admin ? '解锁管理' : '进入工作台';

    async function reloadPages() {

    async function loadTree() {

        treeEntity = '';
        treeFolders = [];
        treeError = '';

      }
      const entityId = selectedEntity;
      if (treeEntity !== entityId) {
        treeEntity = entityId;
        treeFolders = [];
        treeError = '';
      }
      const request = new AbortController();
      treeRequest = request;
      try {
        const data = await apiRequest(entityRoute(entityId) + '/tree', {

        });
        if (treeRequest !== request || selectedEntity !== entityId) return;
        const changed = treeError || treeFolders.length !== data.folders.length

      if (mode === 'page') updateMoveDestination();

    function updateMoveDestination() {

    $('edit-dialog').addEventListener('close', () => { editContext = null; });
    function expandPath(entityId, path) {

    function askConfirmation(title, detail, action, label = '确认') {
      confirmation = action;
      $('confirm-title').textContent = title;
      $('confirm-detail').textContent = detail;
      $('confirm-error').textContent = '';
      $('confirm-submit').textContent = label;
      $('confirm-dialog').showModal();
      $('confirm-dialog').querySelector('.dialog-actions [data-close]').focus();
    }
    $('confirm-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!confirmation || role !== 'admin') return;
      $('confirm-error').textContent = '';
      setBusy($('confirm-dialog'), true);
      try {
        await confirmation();
        $('confirm-dialog').close();
      } catch (error) {
        $('confirm-error').textContent = errorMessage(error);
      } finally {
        setBusy($('confirm-dialog'), false);
      }
    });
    $('confirm-dialog').addEventListener('close', () => { confirmation = null; });
    $('folder-delete').addEventListener('click', () => {
      const context = editContext;
      if (!context || context.mode !== 'folder') return;
      askConfirmation('删除空目录？', context.path, async () => {
        await apiRequest(entityRoute(context.entityId) + '/folders?path=' + encodeURIComponent(context.path), { method: 'DELETE' });
        $('edit-dialog').close();
        await reloadPages();
      }, '删除');
    });

    function shellQuote(value) { return "'" + value.replaceAll("'", "'\\''") + "'"; }
    function updateApiExample(context) {
      const base = location.origin + entityRoute(context.entityId);
      const secret = context.secret || 'YOUR_SPACE_TOKEN';
      $('api-base').textContent = base;
      $('api-secret-section').hidden = !context.secret;
      $('api-secret').value = context.secret || '';
      $('api-command').value = `curl --fail-with-body --request PUT \\\n  ${shellQuote(base + '/files/guides/example.html')} \\\n  --header ${shellQuote('Authorization: Bearer ' + secret)} \\\n  --header 'Content-Type: text/html; charset=utf-8' \\\n  --data-binary @./diagram.html`;
      $('api-agent').value = `请通过此空间的 HTTP API 管理图解，不使用 MCP，也不要索取全局管理密钥。\n空间 API：${base}\n认证：Authorization: Bearer ${context.secret || 'YOUR_SPACE_TOKEN（替换为空间令牌）'}\nGET ${base}/tree 查看目录和图解。\nGET ${base}/files/<逐段 URL 编码的相对路径> 读取可编辑源文件；PUT 同一路径发布或更新 HTML，Content-Type: text/html，正文为原始 HTML，最多 12 MiB。路径以 .html 或 .htm 结束，不使用 .src.html；父目录自动创建。\nPOST ${base}/folders {"path":"主题/目录"} 创建空目录；PATCH 同端点 {"path":"旧目录","newPath":"新目录"} 移动目录；DELETE 同端点加 ?path=<编码路径> 只删除空目录。\nPATCH ${base}/files/<路径> {"path":"新的/图解.html"} 重命名或移动，保留页面标识和分享链接。\n页面响应的 filename 是稳定标识；GET ${location.origin}/api/pages/<filename>/versions 获取真实 Git 版本，POST ${location.origin}/api/pages/<filename>/restore {"revision":"完整提交 SHA"} 恢复为新版本。仅可访问本空间的页面及所属历史。\n不要将版本另存为 v1/v2 文件，不要泄露令牌。\n\n发布示例：\n${$('api-command').value}`;
    }
    $('space-api').addEventListener('click', () => {
      if (!isSpaceSelected()) return;
      apiContext = { entityId: selectedEntity, secret: '', secretId: '' };
      $('api-title').textContent = entityName() + ' · API';
      $('api-status').textContent = '';
      $('token-name').value = '';
      $('api-tokens').replaceChildren();
      $('api-agent').hidden = true;
      updateControls();
      updateApiExample(apiContext);
      $('api-dialog').showModal();
      loadTokens(apiContext);
    });
    $('api-dialog').addEventListener('close', () => {
      if (apiContext) apiContext.secret = '';
      apiContext = null;
      $('api-secret').value = '';
      $('api-command').value = '';
      $('api-agent').value = '';
      $('api-agent').hidden = true;
      $('api-secret-section').hidden = true;
      $('api-tokens').replaceChildren();
      $('token-name').value = '';
      $('api-status').textContent = '';
    });
    $('api-unlock').addEventListener('click', () => requireAdmin(() => {}));
    async function loadTokens(context) {
      if (role !== 'admin' || apiContext !== context) return;
      try {
        const data = await apiRequest(entityRoute(context.entityId) + '/tokens');
        if (apiContext !== context || !$('api-dialog').open) return;
        const fragment = document.createDocumentFragment();
        for (const token of data.tokens) {
          const row = document.createElement('div');
          row.className = 'token-row';
          row.dataset.tokenId = token.id;
          const copy = document.createElement('div');
          copy.className = 'row-copy';
          copy.textContent = token.name;
          const date = document.createElement('small');
          date.textContent = formatDate(token.createdAt);
          copy.append(date);
          const revoke = makeButton('撤销', () => {
            askConfirmation('撤销令牌？', token.name, async () => {
              await apiRequest(entityRoute(context.entityId) + '/tokens/' + encodeURIComponent(token.id), { method: 'DELETE' });
              if (apiContext !== context) return;
              if (context.secretId === token.id) {
                context.secret = '';
                context.secretId = '';
                updateApiExample(context);
              }
              await loadTokens(context);
            }, '撤销');
          }, 'button danger');
          revoke.setAttribute('aria-label', '撤销令牌 ' + token.name);
          row.append(copy, revoke);
          fragment.append(row);
        }
        if (!data.tokens.length) {
          const empty = document.createElement('p');
          empty.className = 'subtle';
          empty.textContent = '暂无令牌';
          fragment.append(empty);
        }
        $('api-tokens').replaceChildren(fragment);
      } catch (error) {
        if (apiContext === context) $('api-status').textContent = errorMessage(error);
      }
    }
    $('token-form').addEventListener('submit', async event => {
      event.preventDefault();
      const context = apiContext;
      if (role !== 'admin' || !context) return;
      $('api-status').textContent = '';
      setBusy($('api-dialog'), true);
      try {
        const data = await apiRequest(entityRoute(context.entityId) + '/tokens', {
          method: 'POST', body: { name: $('token-name').value },
        });
        if (apiContext !== context || !$('api-dialog').open) return;
        context.secret = data.secret;
        context.secretId = data.token.id;
        $('token-name').value = '';
        updateApiExample(context);
        await loadTokens(context);
        $('api-secret').focus();
        $('api-secret').select();
      } catch (error) {
        if (apiContext === context) $('api-status').textContent = errorMessage(error);
      } finally {
        setBusy($('api-dialog'), false);
      }
    });
    async function copyApi(field) {
      const context = apiContext;
      if (!context) return;
      $('api-status').textContent = '';
      const wasHidden = field.hidden;
      field.hidden = false;
      field.focus();
      field.select();
      let copied = false;
      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(field.value);
          copied = true;
        } catch {}
      }
      if (apiContext !== context || !$('api-dialog').open) return;
      if (!copied) {
        field.focus();
        field.select();
        try { copied = document.execCommand('copy'); } catch {}
      }
      if (copied) {
        $('api-status').textContent = '已复制';
        if (wasHidden) field.hidden = true;
      } else {
        $('api-status').textContent = '未能自动复制，内容已选中。请按 Ctrl+C（Mac：⌘C）。';
      }
    }
    $('copy-secret').addEventListener('click', () => copyApi($('api-secret')));
    $('copy-command').addEventListener('click', () => copyApi($('api-command')));
    $('copy-agent').addEventListener('click', () => copyApi($('api-agent')));

    async function openVersions() {
      const page = selected;
      if (!page) return;
      versionsRequest?.abort();
      const request = new AbortController();
      versionsRequest = request;
      $('versions-path').textContent = pagePath(page);
      $('versions-list').textContent = '正在读取…';
      $('versions-error').textContent = '';
      $('versions-retry').hidden = true;
      if (!$('versions-dialog').open) $('versions-dialog').showModal();
      try {
        const data = await apiRequest('/api/pages/' + encodeURIComponent(page.filename) + '/versions', {
          signal: AbortSignal.any([request.signal, AbortSignal.timeout(REQUEST_TIMEOUT)]),
        });
        if (versionsRequest !== request || !$('versions-dialog').open) return;
        const fragment = document.createDocumentFragment();
        for (const version of data.versions) {
          const row = document.createElement('div');
          row.className = 'version-row';
          row.dataset.revision = version.revision;
          const copy = document.createElement('div');
          copy.className = 'row-copy';
          copy.textContent = formatDate(version.createdAt) + ' · ' + version.revision.slice(0, 8);
          const detail = document.createElement('small');
          detail.textContent = version.path + (version.message ? ' · ' + version.message : '');
          copy.append(detail);
          const preview = makeButton('预览', () => {
            historical = { filename: page.filename, version };
            selected = pages.find(item => item.filename === page.filename) || page;
            selectPage(selected);
            $('history-label').textContent = '历史 · ' + formatDate(version.createdAt) + ' · ' + version.revision.slice(0, 8);
            $('history-banner').hidden = false;
            loadPreview({ title: pageTitle(page) + ' · 历史版本', url: version.url });
            $('versions-dialog').close();
            if (compact.matches) setNavigation(false);
            $('history-current').focus();
          });
          row.append(copy, preview);
          fragment.append(row);
        }
        if (!data.versions.length) {
          const empty = document.createElement('p');
          empty.className = 'subtle';
          empty.textContent = '暂无版本';
          fragment.append(empty);
        }
        $('versions-list').replaceChildren(fragment);
      } catch (error) {
        if (versionsRequest !== request || request.signal.aborted) return;
        $('versions-list').replaceChildren();
        $('versions-error').textContent = errorMessage(error);
        $('versions-retry').hidden = false;
      }
    }
    $('page-versions').addEventListener('click', openVersions);
    $('versions-retry').addEventListener('click', openVersions);
    $('versions-dialog').addEventListener('close', () => {
      versionsRequest?.abort();
      versionsRequest = null;
    });
    $('history-current').addEventListener('click', () => {
      if (selected) selectPage(selected, true);
      $('page-title').focus({ preventScroll: true });
    });
    $('history-restore').addEventListener('click', () => {
      const snapshot = historical;
      if (!snapshot) return;
      requireAdmin(() => askConfirmation('恢复此版本？',
        formatDate(snapshot.version.createdAt) + ' · ' + snapshot.version.path + '。将在当前路径创建新版本。',
        async () => {
          const data = await apiRequest('/api/pages/' + encodeURIComponent(snapshot.filename) + '/restore', {
            method: 'POST', body: { revision: snapshot.version.revision },
          });
          selectPage(data.page, true);
          await reloadPages();
        }, '恢复'));
    });

    applyNavigation();
    renderList();
    checkConnection();
    loadPages();
  </script>
</body>
</html>
